<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Scoreboard — projector</title>
		<link rel="shortcut icon" href="favicon.ico">
		<link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/veteran_typewriter-webfont.woff2">
		<link href="./css/style.css" rel="stylesheet" type="text/css">
		<link href="./fonts/veteran_typewriter.css" rel="stylesheet" type="text/css">
		<link href="./css/display.css" rel="stylesheet" type="text/css">
	</head>
	<body>
		<div id="view-scoreboard" class="view-pane active">
			<main></main>
		</div>

			<div id="timer-digits-wrap">
				<div id="timer-digits">00:00.00</div>

		<div id="view-message" class="view-pane">
			<div id="projector-message-wrap">
				<div id="projector-message-text"></div>
			</div>
		</div>

		<script src="js/sync.js" type="text/javascript"></script>
		<script src="js/score-fit.js" type="text/javascript"></script>
		<script src="js/contestant-layout.js" type="text/javascript"></script>
